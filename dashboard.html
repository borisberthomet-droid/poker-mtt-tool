<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg: #080c0e;
  --surface: #0d1214;
  --surface2: #121a1d;
  --surface3: #172025;
  --border: #1e2c32;
  --border2: #243540;
  --green: #00e5a0;
  --green-dim: #00b87e;
  --green-bg: rgba(0,229,160,0.08);
  --green-bg2: rgba(0,229,160,0.04);
  --text: #e2edf0;
  --text-mid: #7a9aA2;
  --text-dim: #3d5560;
  --font: 'Inter', -apple-system, sans-serif;
}
body { background: var(--bg); color: var(--text); font-family: var(--font); min-height: 100vh; padding-bottom: 100px; }

/* Header */
.header { padding: 24px 28px 20px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; }
.header-left h1 { font-size: 15px; font-weight: 700; letter-spacing: 0.5px; color: var(--text); text-transform: uppercase; }
.header-left .sub { font-size: 12px; color: var(--text-dim); margin-top: 3px; letter-spacing: 0.3px; }
.refresh-btn { background: var(--surface2); border: 1px solid var(--border2); color: var(--text-mid); border-radius: 6px; padding: 7px 14px; font-size: 12px; font-family: var(--font); cursor: pointer; transition: all 0.15s; letter-spacing: 0.3px; }
.refresh-btn:hover { border-color: var(--green); color: var(--green); }

/* Tabs */
.tabs { display: flex; border-bottom: 1px solid var(--border); padding: 0 28px; gap: 4px; }
.tab { padding: 11px 16px; font-size: 12px; font-weight: 600; letter-spacing: 0.5px; text-transform: uppercase; color: var(--text-dim); cursor: pointer; border-bottom: 2px solid transparent; margin-bottom: -1px; transition: all 0.15s; }
.tab:hover { color: var(--text-mid); }
.tab.active { color: var(--green); border-bottom-color: var(--green); }

.tab-content { display: none; padding: 28px; }
.tab-content.active { display: block; }

/* KPI row */
.kpi-row { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; margin-bottom: 28px; }
.kpi { background: var(--surface2); border: 1px solid var(--border); border-radius: 8px; padding: 16px 18px; position: relative; overflow: hidden; }
.kpi::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 2px; background: var(--green); opacity: 0.4; }
.kpi.main::before { opacity: 1; }
.kpi-label { font-size: 10px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; color: var(--text-dim); margin-bottom: 10px; }
.kpi-value { font-size: 26px; font-weight: 800; color: var(--text); letter-spacing: -0.5px; line-height: 1; }
.kpi.main .kpi-value { color: var(--green); }
.kpi-sub { font-size: 11px; color: var(--text-dim); margin-top: 4px; }

/* Section label */
.section-label { font-size: 10px; font-weight: 700; letter-spacing: 1.2px; text-transform: uppercase; color: var(--text-dim); margin-bottom: 14px; padding-bottom: 8px; border-bottom: 1px solid var(--border); }

/* Bar list */
.bar-list { display: flex; flex-direction: column; gap: 8px; }
.bar-item { display: flex; align-items: center; gap: 14px; padding: 8px 0; }
.bar-label { font-size: 12px; font-weight: 500; min-width: 170px; color: var(--text-mid); flex-shrink: 0; }
.bar-track { flex: 1; background: var(--surface3); border-radius: 2px; height: 4px; overflow: hidden; }
.bar-fill { height: 100%; background: var(--green); border-radius: 2px; transition: width 0.6s cubic-bezier(0.4,0,0.2,1); }
.bar-value { font-size: 12px; font-weight: 600; color: var(--text); min-width: 55px; text-align: right; font-variant-numeric: tabular-nums; }

/* Table */
.table-wrap { overflow-x: auto; border: 1px solid var(--border); border-radius: 8px; }
table { border-collapse: collapse; width: 100%; font-size: 12px; table-layout: fixed; }
thead { background: var(--surface3); }
th { color: var(--text-dim); font-weight: 700; font-size: 10px; text-transform: uppercase; letter-spacing: 1px; padding: 11px 14px; text-align: center; border-bottom: 1px solid var(--border); }
th:first-child { text-align: left; width: 175px; }
th:last-child { width: 70px; }
td { padding: 10px 14px; border-bottom: 1px solid var(--border); text-align: center; color: var(--text-mid); font-variant-numeric: tabular-nums; }
td:first-child { text-align: left; color: var(--text); font-size: 11px; }
tr:last-child td { border-bottom: none; }
td.has-data { color: var(--text); font-weight: 600; }
td.total-col { color: var(--green); font-weight: 700; }
td.zero { color: var(--text-dim); }
tr:hover td { background: var(--green-bg2); }
.total-row { background: var(--surface3); }
.total-row td { border-top: 1px solid var(--border2); font-weight: 700; color: var(--text); }
.total-row td.total-col { color: var(--green); }

/* Loading */
.loading { text-align: center; padding: 60px; color: var(--text-dim); font-size: 13px; }
.spinner { width: 28px; height: 28px; border: 2px solid var(--border2); border-top-color: var(--green); border-radius: 50%; animation: spin 0.7s linear infinite; margin: 0 auto 14px; }
@keyframes spin { to { transform: rotate(360deg); } }

.divider { height: 1px; background: var(--border); margin: 24px 0; }

/* Routines */
.routine-item { display: flex; align-items: center; gap: 14px; padding: 14px 0; border-bottom: 1px solid var(--border); }
.routine-item:last-child { border-bottom: none; }
.routine-info { flex: 1; }
.routine-nom { font-size: 14px; font-weight: 600; color: var(--text); }
.routine-meta { font-size: 11px; color: var(--text-mid); margin-top: 3px; }
.routine-count { font-size: 13px; font-weight: 700; color: var(--text-dim); min-width: 40px; text-align: center; }
.routine-count.done { color: var(--green); }
.btn-valider { background: var(--green-bg); border: 1px solid rgba(0,229,160,0.3); color: var(--green); border-radius: 8px; padding: 8px 14px; font-size: 12px; font-weight: 700; cursor: pointer; font-family: var(--font); transition: all 0.15s; white-space: nowrap; }
.btn-valider:hover { background: var(--green); color: #080c0e; }
.btn-valider:disabled { opacity: 0.4; cursor: not-allowed; }
.cat-group { margin-bottom: 20px; }
.cat-group-label { font-size: 10px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; color: var(--text-dim); margin-bottom: 8px; padding-bottom: 6px; border-bottom: 1px solid var(--border); }
  .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; height: 64px; background: #0d1214; border-top: 1px solid #1e2c32; display: flex; z-index: 50; padding-bottom: env(safe-area-inset-bottom, 0px); }
  .nav-item { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; text-decoration: none; position: relative; padding-bottom: 4px; }
  .nav-item::after { content: ""; position: absolute; top: 0; left: 25%; right: 25%; height: 2px; background: #00e5a0; border-radius: 0 0 2px 2px; opacity: 0; }
  .nav-item.active::after { opacity: 1; }
  .nav-icon { font-size: 19px; opacity: 0.35; }
  .nav-item.active .nav-icon { opacity: 1; }
  .nav-label { font-size: 9px; font-weight: 700; letter-spacing: 0.6px; text-transform: uppercase; color: #3d5560; }
  .nav-item.active .nav-label { color: #00e5a0; }
</style>
</head>
<body>

<div class="header">
  <div class="header-left">
    <h1>Performance Dashboard</h1>
    <div class="sub" id="last-update">Chargement...</div>
  </div>
  <button class="refresh-btn" onclick="loadData()">↻ Rafraîchir</button>
</div>

<div class="tabs">
  <div class="tab active" onclick="switchTab('lifetime', this)">Lifetime</div>
  <div class="tab" onclick="switchTab('semaines', this)">Par semaine</div>
  <div class="tab" onclick="switchTab('souscats', this)">Sous-catégories</div>
  <div class="tab" onclick="switchTab('routines', this)">Routines</div>
</div>

<div class="tab-content active" id="tab-lifetime">
  <div class="loading" id="loading-lifetime"><div class="spinner"></div>Chargement...</div>
  <div id="content-lifetime" style="display:none">
    <div class="kpi-row" id="kpi-row"></div>
    <div class="divider"></div>
    <div class="section-label">Répartition par catégorie</div>
    <div class="bar-list" id="bar-cats"></div>
  </div>
</div>

<div class="tab-content" id="tab-semaines">
  <div class="table-wrap">
    <table id="table-semaines"><thead></thead><tbody></tbody></table>
  </div>
</div>

<div class="tab-content" id="tab-souscats">
  <div class="section-label">Heures par sous-catégorie</div>
  <div class="bar-list" id="bar-souscats"></div>
</div>

<div class="tab-content" id="tab-routines">
  <div class="section-label">Routines de la semaine</div>
  <div id="routines-list"><div class="loading"><div class="spinner"></div>Chargement...</div></div>
</div>

<script>
const WORKER = 'https://poker-scout-proxy.borisberthomet.workers.dev';
const SESSIONS_DB = '3a938f0c-b1ca-8184-983b-ec5b89e26311';
const SEMAINES_DB = '3a938f0c-b1ca-81f6-aa6d-d26f85d9efe2';
const ROUTINES_DB = '3a938f0c-b1ca-8197-9303-c7d4ba179385';
const VALIDATIONS_DB = '3b338f0c-b1ca-810b-80a1-f7711147c8c9';
const CATS = ['Technique Poker', 'Mental', 'Physique', 'Coaching', 'Business'];
const CAT_ICONS = { 'Technique Poker': '♠', 'Mental': '◈', 'Physique': '◉', 'Coaching': '◆', 'Business': '◇' };
let allSessions = [], allSemaines = [], allRoutines = [], allValidations = [];

// Dates semaine en cours
function getWeekBounds() {
  const now = new Date();
  const monday = new Date(now);
  monday.setDate(now.getDate() - (now.getDay() || 7) + 1);
  monday.setHours(0,0,0,0);
  const sunday = new Date(monday);
  sunday.setDate(monday.getDate() + 6);
  return {
    start: monday.toISOString().split('T')[0],
    end: sunday.toISOString().split('T')[0]
  };
}

function switchTab(name, el) {
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
  el.classList.add('active');
  document.getElementById('tab-' + name).classList.add('active');
}

function minToH(min) {
  if (!min) return '—';
  const h = Math.floor(min / 60), m = min % 60;
  return h > 0 ? (m > 0 ? h + 'h' + String(m).padStart(2,'0') : h + 'h') : m + 'min';
}

async function loadData() {
  document.getElementById('loading-lifetime').style.display = 'block';
  document.getElementById('content-lifetime').style.display = 'none';
  try {
    const week = getWeekBounds();
    const [r1, r2, r3, r4] = await Promise.all([
      fetch(WORKER, { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({route:'notion_get_sessions', database_id: SESSIONS_DB}) }),
      fetch(WORKER, { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({route:'notion_get_semaines', database_id: SEMAINES_DB}) }),
      fetch(WORKER, { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({route:'notion_get_routines', database_id: ROUTINES_DB}) }),
      fetch(WORKER, { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({route:'notion_get_validations', database_id: VALIDATIONS_DB, date_start: week.start, date_end: week.end}) })
    ]);
    allSessions = (await r1.json()).sessions || [];
    allSemaines = (await r2.json()).semaines || [];
    allRoutines = (await r3.json()).routines || [];
    allValidations = (await r4.json()).validations || [];
    renderLifetime(); renderSemaines(); renderSousCats(); renderRoutines();
    document.getElementById('loading-lifetime').style.display = 'none';
    document.getElementById('content-lifetime').style.display = 'block';
    const now = new Date();
    document.getElementById('last-update').textContent = 'Mis à jour ' + now.toLocaleDateString('fr-FR') + ' · ' + now.toLocaleTimeString('fr-FR', {hour:'2-digit', minute:'2-digit'});
  } catch(e) {
    document.getElementById('loading-lifetime').innerHTML = '<div style="color:#e55">Erreur de chargement</div>';
  }
}

function renderLifetime() {
  const totalMin = allSessions.reduce((s,x) => s + x.duree, 0);
  const row = document.getElementById('kpi-row');
  row.innerHTML = `<div class="kpi main"><div class="kpi-label">Total lifetime</div><div class="kpi-value">${minToH(totalMin)}</div><div class="kpi-sub">${allSessions.length} sessions</div></div>`;
  CATS.forEach(cat => {
    const min = allSessions.filter(s => s.categorie === cat).reduce((s,x) => s + x.duree, 0);
    row.innerHTML += `<div class="kpi"><div class="kpi-label">${CAT_ICONS[cat]} ${cat}</div><div class="kpi-value">${minToH(min) === '—' ? '0h' : minToH(min)}</div></div>`;
  });
  const maxMin = Math.max(1, ...CATS.map(cat => allSessions.filter(s => s.categorie === cat).reduce((s,x) => s + x.duree, 0)));
  const barList = document.getElementById('bar-cats');
  barList.innerHTML = '';
  CATS.forEach(cat => {
    const min = allSessions.filter(s => s.categorie === cat).reduce((s,x) => s + x.duree, 0);
    const pct = min / maxMin * 100;
    barList.innerHTML += `<div class="bar-item"><div class="bar-label">${CAT_ICONS[cat]} ${cat}</div><div class="bar-track"><div class="bar-fill" style="width:${pct}%"></div></div><div class="bar-value">${minToH(min) === '—' ? '0h' : minToH(min)}</div></div>`;
  });
}

function renderSemaines() {
  const thead = document.querySelector('#table-semaines thead');
  const tbody = document.querySelector('#table-semaines tbody');
  thead.innerHTML = `<tr><th>Semaine</th>${CATS.map(c => `<th>${CAT_ICONS[c]} ${c.split(' ')[0]}</th>`).join('')}<th>Total</th></tr>`;
  tbody.innerHTML = '';
  const totals = {}; CATS.forEach(c => totals[c] = 0); let grand = 0;
  allSemaines.forEach(sem => {
    const ss = allSessions.filter(s => s.semaine === sem.id);
    let rowTotal = 0, cells = `<td>${sem.nom}</td>`;
    CATS.forEach(cat => {
      const min = ss.filter(s => s.categorie === cat).reduce((s,x) => s + x.duree, 0);
      totals[cat] += min; rowTotal += min;
      cells += `<td class="${min > 0 ? 'has-data' : 'zero'}">${min > 0 ? minToH(min) : '—'}</td>`;
    });
    grand += rowTotal;
    cells += `<td class="total-col">${minToH(rowTotal)}</td>`;
    const tr = document.createElement('tr'); tr.innerHTML = cells; tbody.appendChild(tr);
  });
  const tr = document.createElement('tr'); tr.className = 'total-row';
  let cells = `<td>Total</td>`; CATS.forEach(cat => { cells += `<td class="${totals[cat] > 0 ? 'has-data' : 'zero'}">${minToH(totals[cat])}</td>`; });
  cells += `<td class="total-col">${minToH(grand)}</td>`; tr.innerHTML = cells; tbody.appendChild(tr);
}

function renderSousCats() {
  const totals = {};
  allSessions.forEach(s => { if (s.sousCategorie) totals[s.sousCategorie] = (totals[s.sousCategorie] || 0) + s.duree; });
  const sorted = Object.entries(totals).sort((a,b) => b[1] - a[1]);
  const maxMin = sorted[0]?.[1] || 1;
  const barList = document.getElementById('bar-souscats');
  barList.innerHTML = sorted.length === 0 ? '<div style="color:var(--text-dim);font-size:13px;padding:20px 0">Aucune donnée.</div>' : '';
  sorted.forEach(([name, min]) => {
    barList.innerHTML += `<div class="bar-item"><div class="bar-label">${name}</div><div class="bar-track"><div class="bar-fill" style="width:${min/maxMin*100}%"></div></div><div class="bar-value">${minToH(min)}</div></div>`;
  });
}

function renderRoutines() {
  const container = document.getElementById('routines-list');
  if (allRoutines.length === 0) {
    container.innerHTML = '<div style="color:var(--text-dim);font-size:13px;padding:20px 0">Aucune routine active. Ajoute des routines dans Notion.</div>';
    return;
  }

  // Grouper par catégorie
  const groups = {};
  allRoutines.forEach(r => {
    if (!groups[r.categorie]) groups[r.categorie] = [];
    groups[r.categorie].push(r);
  });

  container.innerHTML = '';
  Object.entries(groups).forEach(([cat, routines]) => {
    const group = document.createElement('div');
    group.className = 'cat-group';
    group.innerHTML = `<div class="cat-group-label">${CAT_ICONS[cat] || '◆'} ${cat}</div>`;

    routines.forEach(r => {
      const count = allValidations.filter(v => v.routine_id === r.id).length;
      const objectif = r.objectif || '—';
      const isDone = r.objectif && count >= r.objectif;

      group.innerHTML += `
        <div class="routine-item">
          <div class="routine-info">
            <div class="routine-nom">${r.nom}</div>
            <div class="routine-meta">${r.frequence} · Objectif : ${objectif}×</div>
          </div>
          <div class="routine-count ${isDone ? 'done' : ''}">${count}/${objectif}</div>
          <button class="btn-valider" onclick="validerRoutine('${r.id}', '${r.nom}', this)" ${isDone ? 'disabled' : ''}>
            ${isDone ? '✅' : '+ 1'}
          </button>
        </div>
      `;
    });

    container.appendChild(group);
  });
}

async function validerRoutine(routineId, nom, btn) {
  btn.disabled = true;
  btn.textContent = '...';
  const today = new Date().toISOString().split('T')[0];
  try {
    const resp = await fetch(WORKER, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        route: 'notion_valider_routine',
        database_id: VALIDATIONS_DB,
        routine_id: routineId,
        nom: nom + ' — ' + today,
        date: today
      })
    });
    const data = await resp.json();
    if (data.success) {
      allValidations.push({ routine_id: routineId, date: today });
      renderRoutines();
    } else {
      btn.disabled = false;
      btn.textContent = '+ 1';
    }
  } catch(e) {
    btn.disabled = false;
    btn.textContent = '+ 1';
  }
}

loadData();

// Ouvrir l'onglet Routines si hash dans l'URL
if (window.location.hash === '#routines') {
  const tab = document.querySelector('.tab:last-child');
  if (tab) switchTab('routines', tab);
}
</script>
<nav class="bottom-nav">
  <a class="nav-item" href="app.html"><div class="nav-icon">🏠</div><div class="nav-label">Accueil</div></a>
  <a class="nav-item" href="journal.html"><div class="nav-icon">📓</div><div class="nav-label">Journal</div></a>
  <a class="nav-item" href="session.html"><div class="nav-icon">⏱️</div><div class="nav-label">Session</div></a>
  <a class="nav-item active" href="dashboard.html"><div class="nav-icon">📊</div><div class="nav-label">Dashboard</div></a>
  <a class="nav-item" href="dashboard.html#routines"><div class="nav-icon">✅</div><div class="nav-label">Routines</div></a>
</nav>
</body>
</html>
