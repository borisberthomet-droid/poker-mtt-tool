<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/theme.css">
<style>
  body { padding-bottom: 100px; }

  .pmt-header-title { font-size: 16px; }

  .content { padding: 24px 24px 0; }

  .tabs { padding: 0 24px; }
  .tab-panel { padding: 24px; }

  /* Donut chart */
  .donut-wrap { display: flex; align-items: center; gap: 24px; flex-wrap: wrap; }
  .donut-svg { flex-shrink: 0; }
  .donut-total-value { font-family: var(--font-mono); font-size: 20px; font-weight: 700; fill: var(--text); }
  .donut-total-label { font-size: 9px; fill: var(--text-dim); letter-spacing: 0.6px; text-transform: uppercase; }

  /* Bar chart (weekly hours) */
  .barchart-wrap { width: 100%; }
  .barchart-svg { width: 100%; height: auto; display: block; }
  .barchart-bar { fill: var(--accent); transition: opacity 0.15s; }
  .barchart-bar:hover { opacity: 0.75; }
  .barchart-axis-label { font-size: 7.5px; fill: var(--text-dim); font-family: var(--font); }
  .barchart-value-label { font-size: 8px; fill: var(--text); font-weight: 600; font-family: var(--font-mono); }
  .barchart-baseline { stroke: var(--border-2); stroke-width: 1; }

  .routine-item { display: flex; align-items: center; gap: 14px; padding: 14px 0; border-bottom: 1px solid var(--border); }
  .routine-item:last-child { border-bottom: none; }
  .routine-info { flex: 1; }
  .routine-nom { font-size: 14px; font-weight: 600; color: var(--text); }
  .routine-meta { font-size: 11px; color: var(--text-mid); margin-top: 3px; }
  .routine-count { font-size: 13px; font-weight: 700; color: var(--text-dim); min-width: 40px; text-align: center; font-family: var(--font-mono); }
  .routine-count.done { color: var(--accent); }
  .btn-valider { background: rgba(52,211,153,0.10); border: 1px solid rgba(52,211,153,0.3); color: var(--accent); border-radius: 8px; padding: 8px 14px; font-size: 12px; font-weight: 700; cursor: pointer; font-family: var(--font); transition: all 0.15s; white-space: nowrap; }
  .btn-valider:hover { background: var(--accent-gradient); color: var(--accent-on); }
  .btn-valider:disabled { opacity: 0.4; cursor: not-allowed; }
  .cat-group { margin-bottom: 20px; }
  .cat-group-label { font-size: 10px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; color: var(--text-dim); margin-bottom: 8px; padding-bottom: 6px; border-bottom: 1px solid var(--border); }
</style>
</head>
<body>

<div class="pmt-header">
  <div class="pmt-logo">
    <svg width="22" height="22" viewBox="0 0 32 32" fill="none" role="img" aria-hidden="true">
      <defs>
        <linearGradient id="pmt-logo-grad-3" x1="4" y1="4" x2="28" y2="28" gradientUnits="userSpaceOnUse">
          <stop offset="0" stop-color="#4ADE80" /><stop offset="1" stop-color="#059669" />
        </linearGradient>
      </defs>
      <circle cx="16" cy="16" r="14.5" stroke="url(#pmt-logo-grad-3)" stroke-width="2" fill="#151917" />
      <path d="M16 7.5C11.5 13 7 17 7 20.5C7 23.2 9.2 25 11.7 25C13.2 25 14.5 24.2 15.2 23C15 24.8 13.7 26.1 12 26.9H20C18.3 26.1 17 24.8 16.8 23C17.5 24.2 18.8 25 20.3 25C22.8 25 25 23.2 25 20.5C25 17 20.5 13 16 7.5Z" fill="url(#pmt-logo-grad-3)" />
    </svg>
    <div>
      <div class="pmt-header-title">📊 Performance Dashboard</div>
      <div class="pmt-header-sub" id="last-update">Chargement...</div>
    </div>
  </div>
  <button class="btn-ghost" onclick="loadData()">↻ Rafraîchir</button>
</div>

<div class="tabs">
  <div class="tab active" onclick="switchTab('lifetime', this)">Lifetime</div>
  <div class="tab" onclick="switchTab('semaines', this)">Par semaine</div>
  <div class="tab" onclick="switchTab('souscats', this)">Sous-catégories</div>
  <div class="tab" onclick="switchTab('routines', this)">Routines</div>
</div>

<div class="tab-content active" id="tab-lifetime">
  <div class="tab-panel">
    <div class="loading" id="loading-lifetime"><div class="spinner"></div>Chargement...</div>
    <div id="content-lifetime" style="display:none">
      <div class="kpi-row" id="kpi-row"></div>

      <div class="divider"></div>

      <div class="section-title">
        <div class="section-title-left">
          <span class="section-title-bar"></span>
          <span class="section-title-text">Répartition par catégorie</span>
        </div>
      </div>
      <div class="donut-wrap">
        <div id="donut-cats"></div>
        <div class="chart-legend" id="legend-cats"></div>
      </div>

      <div class="divider"></div>

      <div class="section-label">Détail</div>
      <div class="bar-list" id="bar-cats"></div>
    </div>
  </div>
</div>

<div class="tab-content" id="tab-semaines">
  <div class="tab-panel">
    <div class="section-title">
      <div class="section-title-left">
        <span class="section-title-bar"></span>
        <span class="section-title-text">Heures par semaine (12 dernières)</span>
      </div>
    </div>
    <div class="barchart-wrap" id="barchart-semaines"></div>

    <div class="divider"></div>

    <div class="table-wrap">
      <table id="table-semaines"><thead></thead><tbody></tbody></table>
    </div>
  </div>
</div>

<div class="tab-content" id="tab-souscats">
  <div class="tab-panel">
    <div class="section-label">Heures par sous-catégorie</div>
    <div class="bar-list" id="bar-souscats"></div>
  </div>
</div>

<div class="tab-content" id="tab-routines">
  <div class="tab-panel">
    <div class="section-label">Routines de la semaine</div>
    <div id="routines-list"><div class="loading"><div class="spinner"></div>Chargement...</div></div>
  </div>
</div>

<script>
const WORKER = 'https://poker-scout-proxy.borisberthomet.workers.dev';
const SESSIONS_DB = '3a938f0c-b1ca-8184-983b-ec5b89e26311';
const SEMAINES_DB = '3a938f0c-b1ca-81f6-aa6d-d26f85d9efe2';
const ROUTINES_DB = '3a938f0c-b1ca-8197-9303-c7d4ba179385';
const VALIDATIONS_DB = '3b338f0c-b1ca-810b-80a1-f7711147c8c9';
const CATS = ['Technique Poker', 'Mental', 'Coaching', 'Business'];
const CAT_ICONS = { 'Technique Poker': '♠', 'Mental': '◈', 'Coaching': '◆', 'Business': '◇' };
// Validated categorical palette (dark surface #151917) — fixed hue order, see dataviz skill.
const CAT_COLORS = { 'Technique Poker': '#3987e5', 'Mental': '#d95926', 'Coaching': '#199e70', 'Business': '#c98500' };
let allSessions = [], allSemaines = [], allRoutines = [], allValidations = [], allValidationsMonth = [], allValidationsYear = [];

// Dates périodes
function getWeekBounds() {
  const now = new Date();
  const monday = new Date(now);
  monday.setDate(now.getDate() - (now.getDay() || 7) + 1);
  monday.setHours(0,0,0,0);
  const sunday = new Date(monday);
  sunday.setDate(monday.getDate() + 6);
  return { start: monday.toISOString().split('T')[0], end: sunday.toISOString().split('T')[0] };
}

function getMonthBounds() {
  const now = new Date();
  const start = new Date(now.getFullYear(), now.getMonth(), 1);
  const end = new Date(now.getFullYear(), now.getMonth() + 1, 0);
  return { start: start.toISOString().split('T')[0], end: end.toISOString().split('T')[0] };
}

function getYearBounds() {
  const now = new Date();
  return { start: `${now.getFullYear()}-01-01`, end: `${now.getFullYear()}-12-31` };
}

function switchTab(name, el) {
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
  el.classList.add('active');
  document.getElementById('tab-' + name).classList.add('active');
}

function minToH(min) {
  if (!min) return '—';
  const h = Math.floor(min / 60), m = min % 60;
  return h > 0 ? (m > 0 ? h + 'h' + String(m).padStart(2,'0') : h + 'h') : m + 'min';
}

function escHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));
}

/* ── Donut chart: category split ──────────────────────────────────────
   Fixed-order categorical palette, validated for the dark panel surface
   (adjacent-pair CVD + normal-vision floors both pass — see CAT_COLORS). */
function renderDonut(containerId, legendId, segments, totalMin) {
  const r = 46, cx = 60, cy = 60, sw = 14, circumference = 2 * Math.PI * r, gap = 3;
  const total = segments.reduce((s, x) => s + x.value, 0);
  let offset = 0;
  let rings = '';
  if (total <= 0) {
    rings = `<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="var(--border-2)" stroke-width="${sw}"/>`;
  } else {
    segments.forEach(seg => {
      if (seg.value <= 0) return;
      const frac = seg.value / total;
      const segLen = Math.max(frac * circumference - gap, 0);
      rings += `<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${seg.color}" stroke-width="${sw}"
        stroke-dasharray="${segLen} ${circumference}" stroke-dashoffset="${-offset}" stroke-linecap="round">
        <title>${escHtml(seg.label)} — ${escHtml(seg.valueLabel)} (${Math.round(frac * 100)}%)</title>
      </circle>`;
      offset += frac * circumference;
    });
  }
  document.getElementById(containerId).innerHTML = `
    <svg class="donut-svg" viewBox="0 0 120 120" width="140" height="140" role="img" aria-label="Répartition des heures par catégorie">
      <g transform="rotate(-90 ${cx} ${cy})">${rings}</g>
      <text x="${cx}" y="${cy - 4}" text-anchor="middle" class="donut-total-value">${minToH(totalMin)}</text>
      <text x="${cx}" y="${cy + 12}" text-anchor="middle" class="donut-total-label">lifetime</text>
    </svg>`;
  document.getElementById(legendId).innerHTML = segments.map(seg => `
    <div class="chart-legend-item">
      <span class="chart-legend-dot" style="background:${seg.color}"></span>
      ${escHtml(seg.label)} · ${escHtml(seg.valueLabel)}
    </div>`).join('');
}

/* ── Bar chart: hours per week (single series → one hue, extreme labeled) ── */
function renderWeeklyBarChart(containerId, items) {
  const el = document.getElementById(containerId);
  if (items.length === 0) { el.innerHTML = `<div style="color:var(--text-dim);font-size:13px;padding:16px 0">Aucune donnée.</div>`; return; }

  const barW = 24, gapW = 10, padTop = 22, padBottom = 20, chartH = 130;
  const w = items.length * (barW + gapW) + gapW;
  const maxVal = Math.max(1, ...items.map(i => i.value));
  const maxIdx = items.reduce((best, i, idx) => i.value > items[best].value ? idx : best, 0);

  let bars = '';
  items.forEach((item, i) => {
    const x = gapW + i * (barW + gapW);
    const h = item.value > 0 ? (item.value / maxVal) * chartH : 0;
    const y = padTop + (chartH - h);
    bars += `<rect class="barchart-bar" x="${x}" y="${y}" width="${barW}" height="${Math.max(h, 1)}" rx="4" ry="4">
      <title>${escHtml(item.fullLabel)} — ${escHtml(minToH(item.value))}</title>
    </rect>`;
    if (i === maxIdx && item.value > 0) {
      bars += `<text x="${x + barW / 2}" y="${y - 6}" text-anchor="middle" class="barchart-value-label">${escHtml(minToH(item.value))}</text>`;
    }
    bars += `<text x="${x + barW / 2}" y="${padTop + chartH + 14}" text-anchor="middle" class="barchart-axis-label">${escHtml(item.label)}</text>`;
  });

  el.innerHTML = `
    <svg class="barchart-svg" viewBox="0 0 ${w} ${padTop + chartH + padBottom}" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Heures travaillées par semaine">
      <line class="barchart-baseline" x1="0" y1="${padTop + chartH}" x2="${w}" y2="${padTop + chartH}"/>
      ${bars}
    </svg>`;
}

async function loadData() {
  document.getElementById('loading-lifetime').style.display = 'block';
  document.getElementById('content-lifetime').style.display = 'none';
  try {
    const week = getWeekBounds();
    const month = getMonthBounds();
    const year = getYearBounds();

    const [r1, r2, r3, r4, r5, r6] = await Promise.all([
      fetch(WORKER, { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({route:'notion_get_sessions', database_id: SESSIONS_DB}) }),
      fetch(WORKER, { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({route:'notion_get_semaines', database_id: SEMAINES_DB}) }),
      fetch(WORKER, { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({route:'notion_get_routines', database_id: ROUTINES_DB}) }),
      fetch(WORKER, { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({route:'notion_get_validations', database_id: VALIDATIONS_DB, date_start: week.start, date_end: week.end}) }),
      fetch(WORKER, { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({route:'notion_get_validations', database_id: VALIDATIONS_DB, date_start: month.start, date_end: month.end}) }),
      fetch(WORKER, { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({route:'notion_get_validations', database_id: VALIDATIONS_DB, date_start: year.start, date_end: year.end}) })
    ]);

    allSessions = (await r1.json()).sessions || [];
    allSemaines = (await r2.json()).semaines || [];
    allRoutines = (await r3.json()).routines || [];
    allValidations = (await r4.json()).validations || [];
    allValidationsMonth = (await r5.json()).validations || [];
    allValidationsYear = (await r6.json()).validations || [];

    renderLifetime(); renderSemaines(); renderSousCats(); renderRoutines();
    document.getElementById('loading-lifetime').style.display = 'none';
    document.getElementById('content-lifetime').style.display = 'block';
    const now = new Date();
    document.getElementById('last-update').textContent = 'Mis à jour ' + now.toLocaleDateString('fr-FR') + ' · ' + now.toLocaleTimeString('fr-FR', {hour:'2-digit', minute:'2-digit'});
  } catch(e) {
    document.getElementById('loading-lifetime').innerHTML = '<div style="color:var(--red)">Erreur de chargement</div>';
  }
}

function renderLifetime() {
  const totalMin = allSessions.reduce((s,x) => s + x.duree, 0);
  const row = document.getElementById('kpi-row');
  row.innerHTML = `<div class="kpi main"><div class="kpi-label">Total lifetime</div><div class="kpi-value">${minToH(totalMin)}</div><div class="kpi-sub">${allSessions.length} sessions</div></div>`;
  CATS.forEach(cat => {
    const min = allSessions.filter(s => s.categorie === cat).reduce((s,x) => s + x.duree, 0);
    row.innerHTML += `<div class="kpi"><div class="kpi-label">${CAT_ICONS[cat]} ${cat}</div><div class="kpi-value">${minToH(min) === '—' ? '0h' : minToH(min)}</div></div>`;
  });

  const segments = CATS.map(cat => ({
    label: cat,
    value: allSessions.filter(s => s.categorie === cat).reduce((s,x) => s + x.duree, 0),
    color: CAT_COLORS[cat],
  })).map(seg => ({ ...seg, valueLabel: minToH(seg.value) === '—' ? '0h' : minToH(seg.value) }));
  renderDonut('donut-cats', 'legend-cats', segments, totalMin);

  const maxMin = Math.max(1, ...CATS.map(cat => allSessions.filter(s => s.categorie === cat).reduce((s,x) => s + x.duree, 0)));
  const barList = document.getElementById('bar-cats');
  barList.innerHTML = '';
  CATS.forEach(cat => {
    const min = allSessions.filter(s => s.categorie === cat).reduce((s,x) => s + x.duree, 0);
    const pct = min / maxMin * 100;
    barList.innerHTML += `<div class="bar-item"><div class="bar-label">${CAT_ICONS[cat]} ${cat}</div><div class="bar-track"><div class="bar-fill" style="width:${pct}%;background:${CAT_COLORS[cat]}"></div></div><div class="bar-value">${minToH(min) === '—' ? '0h' : minToH(min)}</div></div>`;
  });
}

function renderSemaines() {
  const thead = document.querySelector('#table-semaines thead');
  const tbody = document.querySelector('#table-semaines tbody');
  thead.innerHTML = `<tr><th>Semaine</th>${CATS.map(c => `<th>${CAT_ICONS[c]} ${c.split(' ')[0]}</th>`).join('')}<th>Total</th></tr>`;
  tbody.innerHTML = '';
  const totals = {}; CATS.forEach(c => totals[c] = 0); let grand = 0;
  allSemaines.forEach(sem => {
    const ss = allSessions.filter(s => s.semaine === sem.id);
    let rowTotal = 0, cells = `<td>${sem.nom}</td>`;
    CATS.forEach(cat => {
      const min = ss.filter(s => s.categorie === cat).reduce((s,x) => s + x.duree, 0);
      totals[cat] += min; rowTotal += min;
      cells += `<td class="${min > 0 ? 'has-data' : 'zero'}">${min > 0 ? minToH(min) : '—'}</td>`;
    });
    grand += rowTotal;
    cells += `<td class="total-col">${minToH(rowTotal)}</td>`;
    const tr = document.createElement('tr'); tr.innerHTML = cells; tbody.appendChild(tr);
  });
  const tr = document.createElement('tr'); tr.className = 'total-row';
  let cells = `<td>Total</td>`; CATS.forEach(cat => { cells += `<td class="${totals[cat] > 0 ? 'has-data' : 'zero'}">${minToH(totals[cat])}</td>`; });
  cells += `<td class="total-col">${minToH(grand)}</td>`; tr.innerHTML = cells; tbody.appendChild(tr);

  const chartItems = allSemaines.slice(-12).map(sem => {
    const min = allSessions.filter(s => s.semaine === sem.id).reduce((s,x) => s + x.duree, 0);
    const match = sem.nom.match(/Semaine\s*(\d+)/i);
    return { label: match ? 'S' + match[1] : sem.nom.slice(0, 4), fullLabel: sem.nom, value: min };
  });
  renderWeeklyBarChart('barchart-semaines', chartItems);
}

function renderSousCats() {
  const totals = {};
  allSessions.forEach(s => { if (s.sousCategorie) totals[s.sousCategorie] = (totals[s.sousCategorie] || 0) + s.duree; });
  const sorted = Object.entries(totals).sort((a,b) => b[1] - a[1]);
  const maxMin = sorted[0]?.[1] || 1;
  const barList = document.getElementById('bar-souscats');
  barList.innerHTML = sorted.length === 0 ? '<div style="color:var(--text-dim);font-size:13px;padding:20px 0">Aucune donnée.</div>' : '';
  sorted.forEach(([name, min]) => {
    barList.innerHTML += `<div class="bar-item"><div class="bar-label">${name}</div><div class="bar-track"><div class="bar-fill" style="width:${min/maxMin*100}%"></div></div><div class="bar-value">${minToH(min)}</div></div>`;
  });
}

function calcScore(validations, routines, periode) {
  if (routines.length === 0) return 0;
  let total = 0, done = 0;
  routines.forEach(r => {
    if (!r.objectif) return;
    let objectifPeriode = r.objectif;
    if (periode === 'month') {
      if (r.frequence === 'Hebdomadaire') objectifPeriode = r.objectif * 4;
      if (r.frequence === 'Mensuel') objectifPeriode = r.objectif;
      if (r.frequence === 'Quotidien') objectifPeriode = r.objectif * 30;
    } else if (periode === 'year') {
      if (r.frequence === 'Hebdomadaire') objectifPeriode = r.objectif * 52;
      if (r.frequence === 'Mensuel') objectifPeriode = r.objectif * 12;
      if (r.frequence === 'Quotidien') objectifPeriode = r.objectif * 365;
    }
    const count = validations.filter(v => v.routine_id === r.id).length;
    total += objectifPeriode;
    done += Math.min(count, objectifPeriode);
  });
  return total > 0 ? Math.round(done / total * 100) : 0;
}

function renderRoutines() {
  const container = document.getElementById('routines-list');
  if (allRoutines.length === 0) {
    container.innerHTML = '<div style="color:var(--text-dim);font-size:13px;padding:20px 0">Aucune routine active. Ajoute des routines dans Notion.</div>';
    return;
  }

  const scoreWeek = calcScore(allValidations, allRoutines, 'week');
  const scoreMonth = calcScore(allValidationsMonth, allRoutines, 'month');
  const scoreYear = calcScore(allValidationsYear, allRoutines, 'year');

  const scoreColor = s => s >= 80 ? 'var(--accent)' : s >= 50 ? 'var(--yellow)' : 'var(--red)';

  let html = `
    <div class="kpi-row" style="grid-template-columns:1fr 1fr 1fr;margin-bottom:24px">
      <div class="kpi"><div class="kpi-label">Cette semaine</div><div class="kpi-value" style="color:${scoreColor(scoreWeek)}">${scoreWeek}%</div></div>
      <div class="kpi"><div class="kpi-label">Ce mois</div><div class="kpi-value" style="color:${scoreColor(scoreMonth)}">${scoreMonth}%</div></div>
      <div class="kpi"><div class="kpi-label">Cette année</div><div class="kpi-value" style="color:${scoreColor(scoreYear)}">${scoreYear}%</div></div>
    </div>
    <div class="section-label">Détail — semaine en cours</div>
  `;

  // Grouper par catégorie
  const groups = {};
  allRoutines.forEach(r => {
    if (!groups[r.categorie]) groups[r.categorie] = [];
    groups[r.categorie].push(r);
  });

  Object.entries(groups).forEach(([cat, routines]) => {
    html += `<div class="cat-group"><div class="cat-group-label">${CAT_ICONS[cat] || '◆'} ${cat}</div>`;
    routines.forEach(r => {
      const count = allValidations.filter(v => v.routine_id === r.id).length;
      const objectif = r.objectif || '—';
      const isDone = r.objectif && count >= r.objectif;
      html += `
        <div class="routine-item">
          <div class="routine-info">
            <div class="routine-nom">${r.nom}</div>
            <div class="routine-meta">${r.frequence} · Objectif : ${objectif}×</div>
          </div>
          <div class="routine-count ${isDone ? 'done' : ''}">${count}/${objectif}</div>
          <button class="btn-valider" onclick="validerRoutine('${r.id}', '${r.nom}', this)" ${isDone ? 'disabled' : ''}>
            ${isDone ? '✅' : '+ 1'}
          </button>
        </div>
      `;
    });
    html += '</div>';
  });

  container.innerHTML = html;
}

async function validerRoutine(routineId, nom, btn) {
  btn.disabled = true;
  btn.textContent = '...';
  const today = new Date().toISOString().split('T')[0];
  try {
    const resp = await fetch(WORKER, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        route: 'notion_valider_routine',
        database_id: VALIDATIONS_DB,
        routine_id: routineId,
        nom: nom + ' — ' + today,
        date: today
      })
    });
    const data = await resp.json();
    if (data.success) {
      allValidations.push({ routine_id: routineId, date: today });
      renderRoutines();
    } else {
      btn.disabled = false;
      btn.textContent = '+ 1';
    }
  } catch(e) {
    btn.disabled = false;
    btn.textContent = '+ 1';
  }
}

loadData();

// Ouvrir l'onglet Routines si hash dans l'URL
if (window.location.hash === '#routines') {
  const tab = document.querySelector('.tab:last-child');
  if (tab) switchTab('routines', tab);
}
