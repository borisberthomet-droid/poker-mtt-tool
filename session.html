<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Session de travail</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/theme.css">
<style>
  body { padding: 0 0 90px; }

  .pmt-header-title { font-size: 16px; }

  .stats-bar { padding: 16px 24px; border-bottom: 1px solid var(--border); }

  .form {
    padding: 24px;
    max-width: 640px;
    margin: 0 auto;
  }

  .field { margin-bottom: 24px; }

  .sous-cats { display: none; }
  .sous-cats.visible { display: block; }

  .sous-cat-group { margin-bottom: 12px; }
  .sous-cat-group-label {
    font-size: 10px;
    color: var(--text-dim);
    text-transform: uppercase;
    letter-spacing: 0.8px;
    margin-bottom: 6px;
  }

  .duree-row {
    display: flex;
    gap: 8px;
    align-items: center;
  }

  .duree-input {
    flex: 1;
    background: var(--panel-2);
    border: 1px solid var(--border);
    border-radius: 12px;
    color: var(--text);
    font-family: var(--font-mono);
    font-size: 22px;
    font-weight: 600;
    padding: 14px 16px;
    outline: none;
    text-align: center;
    transition: border-color 0.15s;
  }

  .duree-input:focus { border-color: var(--accent); }

  .duree-presets {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
    margin-top: 8px;
  }

  .duree-preset {
    padding: 6px 12px;
    border-radius: 16px;
    border: 1px solid var(--border);
    background: var(--panel-2);
    color: var(--text-mid);
    font-size: 12px;
    cursor: pointer;
    transition: all 0.15s;
  }

  .duree-preset:hover { border-color: var(--accent); color: var(--text); }

  .duree-unit {
    font-size: 13px;
    color: var(--text-dim);
    padding: 14px 0;
    flex-shrink: 0;
  }

  .btn-new-semaine { width: 100%; margin-top: 8px; }
</style>
</head>
<body>

<div class="pmt-header">
  <div class="pmt-logo">
    <svg width="22" height="22" viewBox="0 0 32 32" fill="none" role="img" aria-hidden="true">
      <defs>
        <linearGradient id="pmt-logo-grad-2" x1="4" y1="4" x2="28" y2="28" gradientUnits="userSpaceOnUse">
          <stop offset="0" stop-color="#4ADE80" /><stop offset="1" stop-color="#059669" />
        </linearGradient>
      </defs>
      <circle cx="16" cy="16" r="14.5" stroke="url(#pmt-logo-grad-2)" stroke-width="2" fill="#151917" />
      <path d="M16 7.5C11.5 13 7 17 7 20.5C7 23.2 9.2 25 11.7 25C13.2 25 14.5 24.2 15.2 23C15 24.8 13.7 26.1 12 26.9H20C18.3 26.1 17 24.8 16.8 23C17.5 24.2 18.8 25 20.3 25C22.8 25 25 23.2 25 20.5C25 17 20.5 13 16 7.5Z" fill="url(#pmt-logo-grad-2)" />
    </svg>
    <div>
      <div class="pmt-header-title">⏱️ Session de travail</div>
      <div class="pmt-header-sub" id="today-date"></div>
    </div>
  </div>
</div>

<!-- Stats semaine en cours -->
<div class="stats-bar" id="stats-bar">
  <div class="stat-card">
    <div class="stat-label">Cette semaine</div>
    <div class="stat-value" id="stat-total">—</div>
    <div class="stat-sub">minutes totales</div>
  </div>
  <div class="stat-card">
    <div class="stat-label">Sessions</div>
    <div class="stat-value" id="stat-sessions">—</div>
    <div class="stat-sub">cette semaine</div>
  </div>
</div>

<div class="form">

  <!-- Catégorie -->
  <div class="field">
    <div class="section-label"><span class="section-number">1</span>Catégorie</div>
    <div class="chips" id="chips-cat">
      <div class="chip" data-value="Technique Poker">♠️ Technique</div>
      <div class="chip" data-value="Mental">🧠 Mental</div>
      <div class="chip" data-value="Coaching">🎓 Coaching</div>
      <div class="chip" data-value="Business">📈 Business</div>
    </div>
  </div>

  <!-- Sous-catégorie -->
  <div class="field sous-cats" id="sous-cats">
    <div class="section-label"><span class="section-number">2</span>Sous-catégorie</div>
    <div id="sous-cat-content"></div>
  </div>

  <div class="divider"></div>

  <!-- Focus -->
  <div class="field">
    <div class="section-label"><span class="section-number">3</span>Focus de la session</div>
    <input type="text" id="focus" placeholder="Sur quoi tu travailles précisément ?">
  </div>

  <!-- Durée -->
  <div class="field">
    <div class="section-label"><span class="section-number">4</span>Durée</div>
    <div class="duree-row">
      <input type="number" class="duree-input" id="duree" placeholder="30" min="1">
      <div class="duree-unit">min</div>
    </div>
    <div class="duree-presets">
      <div class="duree-preset" onclick="setDuree(15)">15 min</div>
      <div class="duree-preset" onclick="setDuree(30)">30 min</div>
      <div class="duree-preset" onclick="setDuree(45)">45 min</div>
      <div class="duree-preset" onclick="setDuree(60)">1h</div>
      <div class="duree-preset" onclick="setDuree(90)">1h30</div>
      <div class="duree-preset" onclick="setDuree(120)">2h</div>
      <div class="duree-preset" onclick="setDuree(180)">3h</div>
    </div>
  </div>

  <div class="divider"></div>

  <!-- Semaine -->
  <div class="field">
    <div class="section-label"><span class="section-number">5</span>Semaine</div>
    <select id="semaine-select">
      <option value="">Chargement...</option>
    </select>
    <button class="btn-secondary btn-new-semaine" onclick="createSemaine()">+ Créer la semaine en cours</button>
  </div>

  <button class="btn-submit" id="btn-submit" onclick="submit()">Enregistrer →</button>

</div>

<div class="toast" id="toast"></div>

<script>
const WORKER = 'https://poker-scout-proxy.borisberthomet.workers.dev';
const SESSIONS_DB = '3a938f0c-b1ca-8184-983b-ec5b89e26311';
const SEMAINES_DB = '3a938f0c-b1ca-81f6-aa6d-d26f85d9efe2';

const sousCats = {
  'Technique Poker': [
    { group: 'Préflop / Postflop', items: ['Préflop', 'Postflop SRP IP', 'Postflop SRP OOP', 'Postflop 3BP', 'Postflop BvB', 'Postflop MW'] },
    { group: 'ICM / PKO', items: ['ICM Préflop', 'ICM Postflop', 'PKO'] },
    { group: 'Review', items: ['Review HH', 'Etude reg/pop', 'Sparring'] }
  ],
  'Mental': [
    { group: '', items: ['Méditation', 'Visualisation / Préparation', 'Lecture / Podcast', 'Anglais'] }
  ],
  'Coaching': [
    { group: '', items: ['Préparation cours', 'Coaching groupe', 'Coaching individuel', 'Contenu / Réseaux', 'Review HH élèves'] }
  ],
  'Business': [
    { group: '', items: ['Poker MTT Tool', 'Administratif', 'Stratégie carrière', 'Training poker'] }
  ]
};

const state = { categorie: null, sousCategorie: null, semaineId: null };

// Date
const now = new Date();
document.getElementById('today-date').textContent = now.toLocaleDateString('fr-FR', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });

// Chips catégorie
document.getElementById('chips-cat').querySelectorAll('.chip').forEach(chip => {
  chip.addEventListener('click', () => {
    document.getElementById('chips-cat').querySelectorAll('.chip').forEach(c => c.classList.remove('selected'));
    chip.classList.add('selected');
    state.categorie = chip.dataset.value;
    state.sousCategorie = null;
    renderSousCats(state.categorie);
  });
});

function renderSousCats(cat) {
  const container = document.getElementById('sous-cats');
  const content = document.getElementById('sous-cat-content');
  const groups = sousCats[cat] || [];
  content.innerHTML = '';
  groups.forEach(g => {
    const div = document.createElement('div');
    div.className = 'sous-cat-group';
    if (g.group) div.innerHTML = `<div class="sous-cat-group-label">${g.group}</div>`;
    const chips = document.createElement('div');
    chips.className = 'chips';
    g.items.forEach(item => {
      const chip = document.createElement('div');
      chip.className = 'chip';
      chip.textContent = item;
      chip.addEventListener('click', () => {
        content.querySelectorAll('.chip').forEach(c => c.classList.remove('selected'));
        chip.classList.add('selected');
        state.sousCategorie = item;
      });
      chips.appendChild(chip);
    });
    div.appendChild(chips);
    content.appendChild(div);
  });
  container.classList.add('visible');
}

function setDuree(min) { document.getElementById('duree').value = min; }

// Charger semaines
async function loadSemaines() {
  try {
    const resp = await fetch(WORKER, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ route: 'notion_get_competences', database_id: SEMAINES_DB })
    });
    const data = await resp.json();
    const sel = document.getElementById('semaine-select');
    sel.innerHTML = '<option value="">— Sélectionner une semaine —</option>';
    (data.competences || []).forEach(s => {
      const opt = document.createElement('option');
      opt.value = s.id;
      opt.textContent = s.nom;
      sel.appendChild(opt);
    });
    // Sélectionner automatiquement la première (la plus récente)
    if (data.competences?.length > 0) {
      sel.value = data.competences[0].id;
      state.semaineId = data.competences[0].id;
    }
    sel.addEventListener('change', () => { state.semaineId = sel.value || null; });
  } catch(e) {}
}

loadSemaines();

// Créer semaine en cours
async function createSemaine() {
  const d = new Date();
  const monday = new Date(d);
  monday.setDate(d.getDate() - d.getDay() + 1);
  const dd = monday.getDate().toString().padStart(2, '0');
  const mm = (monday.getMonth() + 1).toString().padStart(2, '0');
  const nom = `Semaine ${getWeekNumber(d)} — ${dd}/${mm}/${monday.getFullYear()}`;

  try {
    const resp = await fetch(WORKER, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        route: 'notion_create_semaine',
        database_id: SEMAINES_DB,
        nom
      })
    });
    const data = await resp.json();
    if (data.success) {
      const sel = document.getElementById('semaine-select');
      const opt = document.createElement('option');
      opt.value = data.id;
      opt.textContent = nom;
      sel.insertBefore(opt, sel.firstChild);
      sel.value = data.id;
      state.semaineId = data.id;
      showToast('✅ Semaine créée', 'ok');
    }
  } catch(e) {
    showToast('❌ Erreur', 'err');
  }
}

function getWeekNumber(d) {
  const date = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
  date.setUTCDate(date.getUTCDate() + 4 - (date.getUTCDay() || 7));
  const yearStart = new Date(Date.UTC(date.getUTCFullYear(), 0, 1));
  return Math.ceil((((date - yearStart) / 86400000) + 1) / 7);
}

// Submit
async function submit() {
  const focus = document.getElementById('focus').value.trim();
  const duree = parseInt(document.getElementById('duree').value);

  if (!state.categorie) return showToast('Sélectionne une catégorie', 'err');
  if (!duree || duree < 1) return showToast('Indique la durée', 'err');
  if (!state.semaineId) return showToast('Sélectionne une semaine', 'err');

  const btn = document.getElementById('btn-submit');
  btn.disabled = true;
  btn.textContent = 'Envoi...';

  const nom = focus || state.sousCategorie || state.categorie;
  const today = now.toISOString().split('T')[0];

  const properties = {
    'Nom': { title: [{ text: { content: nom } }] },
    'Catégorie': { select: { name: state.categorie } },
    'Durée (min)': { number: duree },
    'Date': { date: { start: today } },
    'Semaines': { relation: [{ id: state.semaineId }] }
  };

  if (state.sousCategorie) properties['Sous-catégorie'] = { select: { name: state.sousCategorie } };

  try {
    const resp2 = await fetch(WORKER, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        route: 'notion_push_session',
        properties,
        database_id: SESSIONS_DB
      })
    });
    const data = await resp2.json();


    if (data.success) {
      showToast('✅ Session enregistrée !', 'ok');
      setTimeout(() => {
        btn.disabled = false;
        btn.textContent = 'Enregistrer →';
        resetForm();
      }, 1500);
    } else {
      showToast(`❌ ${data.error || 'Erreur'}`, 'err');
      btn.disabled = false;
      btn.textContent = 'Enregistrer →';
    }
  } catch(e) {
    showToast('❌ Erreur réseau', 'err');
    btn.disabled = false;
    btn.textContent = 'Enregistrer →';
  }
}

function resetForm() {
  document.querySelectorAll('.chip').forEach(c => c.classList.remove('selected'));
  document.getElementById('focus').value = '';
  document.getElementById('duree').value = '';
  document.getElementById('sous-cats').classList.remove('visible');
  state.categorie = null;
  state.sousCategorie = null;
}

function showToast(msg, type) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = `toast ${type} show`;
  setTimeout(() => t.classList.remove('show'), 3000);
}
</script>

  <a class="nav-item" href="app.html"><div class="nav-icon">🏠</div><div class="nav-label">Accueil</div></a>

</nav>
</body>
</html>
