<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Notion Push — Poker MTT Tool</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/theme.css">
<style>
  body { padding-bottom: 40px; }
  main { padding: 1.5rem; max-width: 600px; margin: 0 auto; width: 100%; }
  .sub { font-size: 13px; color: var(--text-mid); margin-bottom: 1.5rem; }
  .api-row { display: flex; align-items: center; gap: 10px; margin-bottom: 1.5rem; background: var(--panel-2); border: 1px solid var(--border); border-radius: 12px; padding: 12px 16px; }
  .api-row label { font-size: 11.5px; color: var(--text-dim); font-family: var(--font-mono); white-space: nowrap; }
  .api-row input { flex: 1; background: transparent; border: none; outline: none; color: var(--text); font-family: var(--font-mono); font-size: 12px; min-width: 0; }
  .show-btn { background: none; border: none; cursor: pointer; color: var(--text-dim); font-size: 12px; font-family: var(--font-mono); padding: 2px 6px; }
  textarea#jsonInput { font-family: var(--font-mono); font-size: 12px; min-height: 200px; line-height: 1.6; margin-bottom: 1rem; }
  .result { border-radius: 12px; padding: 16px; margin-bottom: 1rem; font-size: 14px; display: none; }
  .result.success { background: rgba(52,211,153,0.08); border: 1px solid var(--accent); color: var(--accent); }
  .result.error { background: rgba(248,113,113,0.08); border: 1px solid var(--red); color: var(--red); }
  .history { margin-top: 1.5rem; }
  .history-item { background: var(--panel-2); border: 1px solid var(--border); border-radius: 10px; padding: 12px 16px; margin-bottom: 8px; display: flex; align-items: center; justify-content: space-between; }
  .history-name { font-size: 14px; font-weight: 700; }
  .history-meta { font-size: 12px; color: var(--text-mid); font-family: var(--font-mono); margin-top: 2px; }
  .history-badge { font-size: 11px; padding: 3px 10px; border-radius: 100px; background: rgba(52,211,153,0.1); color: var(--accent); border: 1px solid rgba(52,211,153,0.3); font-family: var(--font-mono); }
  .spinner-inline { display: inline-block; width: 15px; height: 15px; border: 2px solid rgba(255,255,255,0.3); border-top-color: #fff; border-radius: 50%; animation: pmt-spin 0.6s linear infinite; vertical-align: middle; margin-right: 8px; }
  footer { border-top: 1px solid var(--border); padding: 1rem 1.5rem; font-size: 11.5px; color: var(--text-dim); font-family: var(--font-mono); text-align: center; }
</style>
</head>
<body>

<div class="pmt-header">
  <div class="pmt-logo">
    <svg width="20" height="20" viewBox="0 0 32 32" fill="none" role="img" aria-hidden="true">
      <defs><linearGradient id="pmt-logo-grad-np" x1="4" y1="4" x2="28" y2="28" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#4ADE80" /><stop offset="1" stop-color="#059669" /></linearGradient></defs>
      <circle cx="16" cy="16" r="14.5" stroke="url(#pmt-logo-grad-np)" stroke-width="2" fill="#151917" />
      <path d="M16 7.5C11.5 13 7 17 7 20.5C7 23.2 9.2 25 11.7 25C13.2 25 14.5 24.2 15.2 23C15 24.8 13.7 26.1 12 26.9H20C18.3 26.1 17 24.8 16.8 23C17.5 24.2 18.8 25 20.3 25C22.8 25 25 23.2 25 20.5C25 17 20.5 13 16 7.5Z" fill="url(#pmt-logo-grad-np)" />
    </svg>
    <div class="pmt-header-title">Notion Push</div>
  </div>
  <a href="app.html" class="btn-ghost">← Accueil</a>
</div>

<main>
  <p class="sub">Colle le JSON généré par Claude → envoi direct dans ta Bibliothèque de Regs</p>

  <div class="api-row">
    <label>API KEY</label>
    <input type="password" id="apiKey" placeholder="sk-ant-api03-..." autocomplete="off">
    <button class="show-btn" id="showBtn">show</button>
  </div>

  <div class="section-label">JSON joueur</div>
  <textarea id="jsonInput" placeholder='{"name":"Arthur Peacock","country":"USA","danger":"🔴 Élevé","earnings":2495877,...}'></textarea>

  <button class="btn-submit" id="btnPush">→ Envoyer dans Notion</button>
  <button class="btn-secondary" id="btnClear" style="width:100%;margin-top:10px">✕ Effacer</button>

  <div class="result" id="result"></div>

  <div class="history" id="history" style="display:none">
    <div class="section-label">Fiches envoyées aujourd'hui</div>
    <div id="historyList"></div>
  </div>
</main>
<footer>Boris Berthomet · Poker MTT Tool · Notion Push</footer>

<script>
const WORKER = 'https://poker-scout-proxy.borisberthomet.workers.dev/';
const history = [];

const savedKey = localStorage.getItem('scout_key');
if (savedKey) document.getElementById('apiKey').value = savedKey;
document.getElementById('apiKey').addEventListener('input', e => localStorage.setItem('scout_key', e.target.value));

document.getElementById('showBtn').addEventListener('click', () => {
  const inp = document.getElementById('apiKey');
  const btn = document.getElementById('showBtn');
  inp.type = inp.type === 'password' ? 'text' : 'password';
  btn.textContent = inp.type === 'password' ? 'show' : 'hide';
});

document.getElementById('btnClear').addEventListener('click', () => {
  document.getElementById('jsonInput').value = '';
  document.getElementById('result').style.display = 'none';
});

document.getElementById('btnPush').addEventListener('click', async () => {
  const apiKey = document.getElementById('apiKey').value.trim();
  const jsonRaw = document.getElementById('jsonInput').value.trim();
  const btn = document.getElementById('btnPush');
  const result = document.getElementById('result');

  if (!apiKey) { showResult('error', '⚠ Entre ta clé API Anthropic en haut.'); return; }
  if (!jsonRaw) { showResult('error', '⚠ Colle le JSON généré par Claude.'); return; }

  let player;
  try {
    player = JSON.parse(jsonRaw);
  } catch(e) {
    showResult('error', '⚠ JSON invalide. Vérifie la syntaxe.');
    return;
  }

  if (!player.name) { showResult('error', '⚠ Le champ "name" est obligatoire.'); return; }

  btn.disabled = true;
  btn.innerHTML = '<span class="spinner-inline"></span>Envoi en cours...';
  result.style.display = 'none';

  try {
    const resp = await fetch(WORKER, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'x-api-key': apiKey },
      body: JSON.stringify({ route: 'notion', player })
    });
    const data = await resp.json();

    if (data.success) {
      showResult('success', `✅ ${player.name} ajouté dans Notion !`);
      addToHistory(player);
      document.getElementById('jsonInput').value = '';
    } else {
      showResult('error', `❌ Erreur Notion : ${data.error}`);
    }
  } catch(e) {
    showResult('error', '❌ Erreur réseau : ' + e.message);
  }

  btn.disabled = false;
  btn.innerHTML = '→ Envoyer dans Notion';
});

function showResult(type, msg) {
  const el = document.getElementById('result');
  el.className = 'result ' + type;
  el.textContent = msg;
  el.style.display = 'block';
}

function addToHistory(player) {
  history.unshift({ name: player.name, danger: player.danger || '—', time: new Date().toLocaleTimeString('fr-FR', {hour:'2-digit', minute:'2-digit'}) });
  const histEl = document.getElementById('history');
  const listEl = document.getElementById('historyList');
  histEl.style.display = 'block';
  listEl.innerHTML = history.map(h => `
    <div class="history-item">
      <div>
        <div class="history-name">${h.name}</div>
        <div class="history-meta">${h.time}</div>
      </div>
      <span class="history-badge">✅ Envoyé</span>
    </div>
  `).join('');
}
</script>
</body>
</html>
